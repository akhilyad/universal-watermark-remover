<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="uwrb-title uwrb-desc">
  <title id="uwrb-title">Watermark Remover Studio</title>
  <desc id="uwrb-desc">Multi-modal metadata purification, C2PA stripping, invisible Unicode sanitizer, and boundary inpainting engine.</desc>
  <defs>
    <clipPath id="uwrb-frame">
      <rect width="1280" height="420" rx="28"/>
    </clipPath>
    <radialGradient id="uwrb-glow-cyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="uwrb-glow-mint" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10B981" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="uwrb-grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <radialGradient id="uwrb-grid-fade" cx="0.42" cy="0.48" r="0.65">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <mask id="uwrb-grid-mask">
      <rect width="1280" height="420" fill="url(#uwrb-grid-fade)"/>
    </mask>
    <linearGradient id="uwrb-wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.62" stop-color="#BAE6FD"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="uwrb-top-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="0.7" stop-color="#10B981" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="uwrb-card-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7DD3FC" stop-opacity="0.78"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0.78"/>
    </linearGradient>
    <linearGradient id="uwrb-card-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18181B" stop-opacity="0.88"/>
      <stop offset="1" stop-color="#09090B" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="uwrb-card-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#uwrb-frame)">
    <rect width="1280" height="420" fill="#09090B"/>
    <ellipse cx="220" cy="40" rx="520" ry="300" fill="url(#uwrb-glow-cyan)"/>
    <ellipse cx="1040" cy="360" rx="460" ry="280" fill="url(#uwrb-glow-mint)"/>
    <rect width="1280" height="420" fill="url(#uwrb-grid)" mask="url(#uwrb-grid-mask)"/>

    <text x="530" y="425" font-family="'JetBrains Mono', Consolas, monospace" font-size="310" font-weight="800" fill="#FFFFFF" fill-opacity="0.025">//</text>

    <rect x="0" y="0" width="1280" height="2" fill="url(#uwrb-top-line)"/>

    <!-- Eyebrow pill -->
    <g font-family="'JetBrains Mono', Consolas, monospace">
      <rect x="80" y="68" width="330" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.06" stroke="#38BDF8" stroke-opacity="0.4"/>
      <circle cx="101" cy="84" r="8" fill="#10B981" fill-opacity="0.28"/>
      <circle cx="101" cy="84" r="4" fill="#10B981"/>
      <text x="118" y="89" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#E0F2FE">PROVENANCE &amp; INPAINTING STUDIO</text>
    </g>

    <!-- Monospace/Technical Wordmark -->
    <text x="76" y="182" font-family="'Inter', system-ui, sans-serif" font-size="54" font-weight="800" letter-spacing="1" fill="url(#uwrb-wordmark)">WATERMARK//REMOVER</text>

    <!-- Tagline -->
    <text x="80" y="232" font-family="'Inter', system-ui, sans-serif" font-size="22" font-weight="500" fill="#D4D4D8">Strip C2PA provenance, zero-width layers &amp; pixel marks</text>

    <!-- Chips -->
    <g font-family="'Inter', system-ui, sans-serif" font-size="14.5" font-weight="700" text-anchor="middle">
      <rect x="80" y="278" width="126" height="36" rx="18" fill="#38BDF8" fill-opacity="0.16" stroke="#38BDF8" stroke-opacity="0.58"/>
      <text x="143" y="301" fill="#BAE6FD">22+ Formats</text>

      <rect x="218" y="278" width="152" height="36" rx="18" fill="#10B981" fill-opacity="0.18" stroke="#10B981" stroke-opacity="0.58"/>
      <text x="294" y="301" fill="#A7F3D0">OpenCV Inpaint</text>

      <rect x="382" y="278" width="142" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.2"/>
      <text x="453" y="301" fill="#F4F4F5">C2PA &amp; EXIF</text>

      <rect x="536" y="278" width="132" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.18"/>
      <text x="602" y="301" fill="#D4D4D8">SARIF 2.1</text>
    </g>

    <!-- Stack line -->
    <text x="80" y="366" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="500" letter-spacing="0.4" fill="#A1A1AA">React 19 · Vite 8 · Tailwind CSS 4 · Python 3 · OpenCV · ExifTool · QPDF</text>

    <!-- Right motif card: Multi-Layer Purification Matrix -->
    <rect x="846" y="48" width="352" height="296" rx="22" fill="#FFFFFF" fill-opacity="0.025" stroke="#38BDF8" stroke-opacity="0.2" transform="rotate(4 1022 196)"/>
    <rect x="826" y="64" width="372" height="296" rx="22" fill="url(#uwrb-card-fill)"/>
    <rect x="826" y="64" width="372" height="118" rx="22" fill="url(#uwrb-card-sheen)"/>
    <rect x="826.75" y="64.75" width="370.5" height="294.5" rx="21.25" fill="none" stroke="url(#uwrb-card-border)" stroke-width="1.5"/>

    <g font-family="'Inter', system-ui, sans-serif">
      <text x="854" y="102" font-size="16.5" font-weight="700" fill="#FAFAFA">Purification pipeline</text>
      <rect x="1076" y="84" width="98" height="26" rx="13" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-opacity="0.55"/>
      <text x="1125" y="101" font-size="11.5" font-weight="700" text-anchor="middle" fill="#A7F3D0">Loopback API</text>

      <!-- Plane rows -->
      <rect x="854" y="128" width="318" height="50" rx="12" fill="#FFFFFF" fill-opacity="0.045" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <rect x="866" y="140" width="8" height="26" rx="4" fill="#38BDF8"/>
      <text x="884" y="149" font-size="13.5" font-weight="700" fill="#FAFAFA">Images &amp; Containers</text>
      <text x="884" y="166" font-family="'JetBrains Mono', monospace" font-size="11" fill="#A1A1AA">PNG · JPEG · WebP · PDF · Office · ISOBMFF</text>

      <rect x="854" y="188" width="318" height="50" rx="12" fill="#FFFFFF" fill-opacity="0.045" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <rect x="866" y="200" width="8" height="26" rx="4" fill="#10B981"/>
      <text x="884" y="209" font-size="13.5" font-weight="700" fill="#FAFAFA">Pixel &amp; Atom Cleaners</text>
      <text x="884" y="226" font-family="'JetBrains Mono', monospace" font-size="11" fill="#A1A1AA">TopHat · Telea/NS · Reverse Alpha · FFmpeg</text>

      <rect x="854" y="248" width="318" height="50" rx="12" fill="#FFFFFF" fill-opacity="0.045" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <rect x="866" y="260" width="8" height="26" rx="4" fill="#A1A1AA"/>
      <text x="884" y="269" font-size="13.5" font-weight="700" fill="#FAFAFA">Text &amp; Provenance Guards</text>
      <text x="884" y="286" font-family="'JetBrains Mono', monospace" font-size="11" fill="#A1A1AA">Zero-Width Strip · Homoglyphs · SARIF 2.1.0</text>

      <line x1="854" y1="316" x2="1172" y2="316" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <text x="854" y="338" font-family="'JetBrains Mono', monospace" font-size="11.5" fill="#A1A1AA">Browser WASM/Canvas + Python /clean sidecar</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="419" rx="27.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.09"/>
</svg>
