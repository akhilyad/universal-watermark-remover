<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="uwr-logo-title">
  <title id="uwr-logo-title">Universal Watermark Remover Logo</title>
  <defs>
    <linearGradient id="uwr-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18181B"/>
      <stop offset="1" stop-color="#09090B"/>
    </linearGradient>
    <linearGradient id="uwr-scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <pattern id="uwr-px" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M12 0H0V12" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="0.75"/>
    </pattern>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#uwr-bg)"/>
  <rect width="128" height="128" rx="28" fill="url(#uwr-px)"/>
  <!-- Minimalist Shield emblem matching Navbar ShieldCheck motif -->
  <path d="M64 24L96 36V62C96 81 82 97 64 104C46 97 32 81 32 62V36L64 24Z" fill="#FFFFFF" fill-opacity="0.06" stroke="#FAFAFA" stroke-width="4" stroke-linejoin="round"/>
  <!-- Verification checkmark -->
  <path d="M51 64L60 73L78 53" fill="none" stroke="#10B981" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Horizontal purification scanbeam -->
  <line x1="22" y1="64" x2="106" y2="64" stroke="url(#uwr-scan)" stroke-width="2.5" stroke-opacity="0.8" stroke-dasharray="4 4"/>
  <rect x="0.75" y="0.75" width="126.5" height="126.5" rx="27.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1.5"/>
</svg>

